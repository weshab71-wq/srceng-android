name: Build android package

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build
        run: |
          # Enable 32-bit architecture for legacy Android SDK build tools (aapt)
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y make ant ant-contrib python3-requests python3-pip zip lib32z1 lib32stdc++6 zlib1g:i386
          sudo pip3 install websocket-client

          # Force JAVA_HOME to Java 8
          export JAVA_HOME=$JAVA_HOME_8_X64
          export PATH=$JAVA_HOME/bin:$PATH

          # Clone Android SDK and Source SDK safely
          git clone --depth 1 https://gitlab.com/LostGamer/android-sdk
          git clone --depth 1 https://github.com/nillerusr/srcsdk.git

          # Use an absolute raw binary URL for NDK r10e archive to prevent HTML redirect errors
          curl -L -o ndk.tar.bz2 https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.tar.bz2 || \
          curl -L -o ndk.tar.bz2 https://raw.githubusercontent.com/FelisCatus/android-ndk-r10e/master/android-ndk-r10e-linux-x86_64.tar.bz2

          tar -xjf ndk.tar.bz2
          mv android-ndk-r10e* android-ndk-r10e

          # Nuke test directories to prevent Ant errors
          rm -rf android-ndk-r10e/tests

          # Set app display name to Portal 2 (keeps internal package ID unchanged to avoid JNI crashes)
          find . -type f -name 'strings.xml' -exec sed -i 's/Source Engine/Portal 2/g' {} +
          find . -type f -name 'AndroidManifest.xml' -exec sed -i "s/launchMode='standard'/launchMode='singleTask'/g" {} +

          # Grant execution permissions and run workflow script
          if [ -f 'scripts/workflow.sh' ]; then
            chmod +x scripts/workflow.sh
            DEPLOY_BRANCH=srceng-old-port COMMIT=$(git rev-parse HEAD) scripts/workflow.sh
          elif [ -f 'workflow.sh' ]; then
            chmod +x workflow.sh
            DEPLOY_BRANCH=srceng-old-port COMMIT=$(git rev-parse HEAD) ./workflow.sh
          fi

          # Collect built libraries and packages into bin/ for artifact upload
          mkdir -p bin
          find . -name '*.apk' ! -path '*/android-sdk/*' -exec cp {} bin/ \; 2>/dev/null || true
          find /tmp/sdl_src -name '*.so' -exec cp {} bin/ \; 2>/dev/null || true
          find . -name '*.so' ! -path '*/android-sdk/*' -exec cp {} bin/ \; 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/*
