name: Build android package

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build
        run: |
          # Enable 32-bit architecture for legacy Android SDK build tools (aapt)
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y make ant ant-contrib python3-requests python3-pip zip lib32z1 lib32stdc++6 zlib1g:i386 p7zip-full zipalign apksigner
          sudo pip3 install websocket-client

          # Force JAVA_HOME to Java 8
          export JAVA_HOME=$JAVA_HOME_8_X64
          export PATH=$JAVA_HOME/bin:$PATH

          # Clone Android SDK and Source SDK
          git clone --depth 1 https://gitlab.com/LostGamer/android-sdk
          git clone --depth 1 https://github.com/nillerusr/srcsdk.git

          # Download and extract the official NDK r10e self-extracting binary
          wget -q https://dl.google.com/android/ndk/android-ndk-r10e-linux-x86_64.bin -O ndk.bin
          chmod +x ndk.bin
          ./ndk.bin > /dev/null

          # Nuke test directories to prevent Ant errors
          rm -rf android-ndk-r10e/tests

          # Set app display name to Portal 2 (keeps internal package ID unchanged to avoid JNI crashes)
          find . -type f -name 'strings.xml' -exec sed -i 's/Source Engine/Portal 2/g' {} +
          find . -type f -name 'AndroidManifest.xml' -exec sed -i "s/launchMode='standard'/launchMode='singleTask'/g" {} +

          # Bump targetSdkVersion to 28 to bypass modern Android low target SDK install blocks
          find . -type f -name 'AndroidManifest.xml' -exec sed -i 's/targetSdkVersion="[0-9]*"/targetSdkVersion="28"/g' {} +

          # Grant execution permissions and run workflow script
          if [ -f 'scripts/workflow.sh' ]; then
            chmod +x scripts/workflow.sh
            DEPLOY_BRANCH=srceng-old-port COMMIT=$(git rev-parse HEAD) scripts/workflow.sh
          elif [ -f 'workflow.sh' ]; then
            chmod +x workflow.sh
            DEPLOY_BRANCH=srceng-old-port COMMIT=$(git rev-parse HEAD) ./workflow.sh
          fi

          # Clean up any existing keystores and generate a fresh key pair
          rm -f debug.keystore
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias portal2key -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p bin
          RAW_APK=$(find . -name 'NativeCodec-debug.apk' | head -n 1)

          if [ -n "$RAW_APK" ]; then
            zipalign -v 4 "$RAW_APK" bin/Portal2-aligned.apk
            apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out bin/Portal2-Installable.apk bin/Portal2-aligned.apk
          else
            find . -name '*.apk' ! -path '*/android-sdk/*' -exec cp {} bin/ \; 2>/dev/null || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/Portal2-Installable.apk
